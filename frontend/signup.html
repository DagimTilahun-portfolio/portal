<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clinician Registration - DHDPM</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    body { background: var(--bg-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { background: white; padding: 2.5rem; border-radius: 12px; width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.4rem; }
    input, select { padding: 0.75rem; border: 1px solid #CBD5E1; border-radius: 6px; }
    .btn-submit { width: 100%; padding: 0.85rem; background: var(--color-primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
    .error-box { background: #FEE2E2; color: #991B1B; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>
  <div class="auth-card">
    <h2>Register Clinician Account</h2>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">የሕመሙ ባለሙያ መመዝገቢያ</p>
    
    <div id="errorMsg" class="error-box"></div>

    <form id="signupForm">
      <div class="form-group">
        <label>Full Name / ሙሉ ስም</label>
        <input type="text" id="fullName" placeholder="Dr. Abebe Kebede" required>
      </div>
      <div class="form-group">
        <label>Email Address / ኢሜይል</label>
        <input type="email" id="email" placeholder="abebe@clinic.et" required>
      </div>
      <div class="form-group">
        <label>Role / የሥራ ድርሻ</label>
        <select id="role">
          <option value="Cardiologist">Cardiologist</option>
          <option value="General Practitioner">General Practitioner</option>
          <option value="Health Extension Worker">Health Extension Worker</option>
        </select>
      </div>
      <div class="form-group">
        <label>Password / የይለፍ ቃል</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn-submit">Create Account / ተመዝገብ</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.85rem;">Already have an account? <a href="login.html">Sign In</a></p>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorMsg');
      errorBox.style.display = 'none';

      const payload = {
        full_name: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        role: document.getElementById('role').value,
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('http://127.0.0.1:8000/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);

        alert("Account registered successfully! Please sign in.");
        window.location.href = 'login.html';
      } catch (err) {
        errorBox.innerText = err.message;
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
